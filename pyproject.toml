[project]
name = "conceptmod"
version = "2.0.0"
description = "Finetuning with words: a DSL for concept editing of flow-matching diffusion models"
requires-python = ">=3.11"
dependencies = [
    # PyPI: current GANTrainer + learned prior, and historical RpGAN/b_cap primitives.
    "particlegan>=0.9.4,<0.10",
    "torch>=2.8",
    "torchvision",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate",
    "safetensors",
    "datasets",
    "sentencepiece",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["conceptmod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
