[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "conceptmod"
version = "3.1.0"
description = "Model-independent concept editing plans, execution and artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.8,<3",
    # v0.10.0; immutable release source while its PyPI publication is unavailable.
    "particlegan @ https://github.com/HyperGAN/ParticleGAN/archive/952c3b62ba434f7da194067923351ff5748ef8dd.tar.gz#sha256=46d33f84464c74f92c3a5cb1047c0fc5dea1a057559f899366796fbd6b37f8ac",
]

[project.optional-dependencies]
serialization = ["safetensors>=0.6,<1"]
presentation = ["pillow>=13.0.0,<14"]
test = [
    "pytest>=8", "build>=1.2", "setuptools>=77", "wheel",
    "peft>=0.17,<1", "safetensors>=0.6,<1", "pillow>=13.0.0,<14", "matplotlib",
]

[project.urls]
Source = "https://github.com/HyperGAN/conceptmod"
Documentation = "https://github.com/HyperGAN/conceptmod/blob/main/docs/api.md"
Issues = "https://github.com/HyperGAN/conceptmod/issues"

[project.scripts]
conceptmod = "conceptmod.cli:main"

[tool.setuptools]
packages = ["conceptmod", "conceptmod.backends"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
