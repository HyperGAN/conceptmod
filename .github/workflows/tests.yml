name: Core contracts
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          with zipfile.ZipFile(glob.glob('dist/*.whl')[0]) as wheel:
              backends = {name for name in wheel.namelist() if name.startswith('conceptmod/backends/')}
              assert backends == {'conceptmod/backends/__init__.py', 'conceptmod/backends/base.py'}, backends
              assert not any(name.startswith('conceptmod/convert') for name in wheel.namelist())
          PY
