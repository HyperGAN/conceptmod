[project]
name = "conceptmod"
version = "2.0.0"
description = "Finetuning with words: a DSL for concept editing of flow-matching diffusion models"
requires-python = ">=3.11"
dependencies = [
    # PyPI (`pip install particlegan`). RpGAN, GradRegularizer/b_cap, ParticlePrior.
    "particlegan>=0.5.0",
    "torch>=2.8",
    "torchvision",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate",
    "safetensors",
    "datasets",
    "sentencepiece",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
modern = [
    "particle-sliders-core[hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@a794e3b4a8813b012f2c4faa3da82b78d4a90214#subdirectory=packages/particle-sliders-core",
]

[tool.setuptools.package-data]
"conceptmod.modern" = ["sources.json", "*.hndl"]

[tool.setuptools.packages.find]
include = ["conceptmod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
