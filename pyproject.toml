[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "conceptmod"
version = "3.1.1"
description = "Model-independent concept editing plans, execution and artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.8,<3",
    # Unchanged upstream v0.10.0 CI wheel, mirrored while PyPI publication is unavailable.
    "particlegan @ https://github.com/HyperGAN/conceptmod/releases/download/v3.1.0/particlegan-0.10.0-py3-none-any.whl#sha256=135f8507956d5ef70eabf212cf117e2cf94ffb6338d3520adcb813b5b1be2bed",
]

[project.optional-dependencies]
serialization = ["safetensors>=0.6,<1"]
presentation = ["pillow>=13.0.0,<14"]
test = [
    "pytest>=8", "build>=1.2", "setuptools>=77", "wheel",
    "peft>=0.17,<1", "safetensors>=0.6,<1", "pillow>=13.0.0,<14", "matplotlib",
]

[project.urls]
Source = "https://github.com/HyperGAN/conceptmod"
Documentation = "https://github.com/HyperGAN/conceptmod/blob/main/docs/api.md"
Issues = "https://github.com/HyperGAN/conceptmod/issues"

[project.scripts]
conceptmod = "conceptmod.cli:main"

[tool.setuptools]
packages = ["conceptmod", "conceptmod.backends"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
