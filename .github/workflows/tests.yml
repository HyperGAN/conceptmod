name: Core contracts
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' build twine
      - name: Check strict editable boundary
        run: python scripts/check_distribution.py --installed
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check wheel and installed runtime
        run: |
          python scripts/check_distribution.py --wheel dist/conceptmod-3.0.0-py3-none-any.whl
          python -m pip install --force-reinstall --no-deps dist/conceptmod-3.0.0-py3-none-any.whl
          python scripts/check_distribution.py --installed
      - name: Test installed core outside checkout
        run: |
          source_root="$PWD"
          cd /tmp
          python -m pytest -q --import-mode=importlib \
            "$source_root/tests/test_training_session.py" \
            "$source_root/tests/test_model_train_state.py" \
            "$source_root/tests/test_plan_providers.py" \
            "$source_root/tests/test_particle_lora.py" \
            "$source_root/tests/test_particle_api.py" \
            "$source_root/tests/test_metrics.py" \
            "$source_root/tests/test_core_isolation.py"
