[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conceptmod"
version = "3.0.0"
description = "Model-independent concept editing plans, execution and artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.8,<3", "particlegan==0.9.4"]

[project.optional-dependencies]
serialization = ["safetensors>=0.6,<1"]
presentation = ["pillow>=13.0.0,<14"]
research = ["matplotlib"]
peft-test = ["peft>=0.17,<1", "safetensors>=0.6,<1", "pillow>=13.0.0,<14"]
test = ["pytest>=8", "peft>=0.17,<1", "safetensors>=0.6,<1", "pillow>=13.0.0,<14", "matplotlib"]

[project.scripts]
conceptmod = "conceptmod.cli:main"

[tool.setuptools.packages.find]
include = ["conceptmod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
